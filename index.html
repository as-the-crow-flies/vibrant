<html lang="en">
    <head>
        <title>VIBRANT</title>
        <meta content="text/html;charset=utf-8" http-equiv="Content-Type" />
        <style>
            * {
                padding: 0;
                margin: 0;
            }

            canvas {
                width: 100vw;
                height: 100vh;
                -webkit-touch-callout: none;
                -webkit-user-select: none;
                -khtml-user-select: none;
                -moz-user-select: none;
                -ms-user-select: none;
                user-select: none;
                outline: none;
                -webkit-tap-highlight-color: rgba(
                    255,
                    255,
                    255,
                    0
                ); /* mobile webkit */
            }
        </style>
    </head>
    <body>
        <canvas id="canvas"></canvas>
        <script type="module">
            // wgpu-rs's WebGPU backend doesn't forward the "subgroups"
            // feature to GPUAdapter.requestDevice() (it's still treated as
            // native-only, see gfx-rs/wgpu#5555), even though browsers that
            // support it accept it fine. Patch it back in here so devices
            // whose adapter actually advertises "subgroups" get it enabled.
            if (typeof GPUAdapter !== "undefined") {
                const requestDevice = GPUAdapter.prototype.requestDevice;
                GPUAdapter.prototype.requestDevice = function (descriptor = {}) {
                    const requiredFeatures = new Set(descriptor.requiredFeatures ?? []);
                    if (this.features.has("subgroups")) {
                        requiredFeatures.add("subgroups");
                    }
                    return requestDevice.call(this, {
                        ...descriptor,
                        requiredFeatures: [...requiredFeatures],
                    });
                };
            }

            import init from "./pkg/vibrant_app_web.js";
            init();
        </script>
    </body>
</html>
