[workspace]
members = ["vibrant"]

[package]
name = "vibrant-app"
version = "0.1.0"
edition = "2021"

[lib]
name = "vibrant_app_web"
crate-type = ["cdylib"]

[workspace.dependencies]
wgpu = "27"
winit = "0.30.12"

egui = { version = "0.33" }
egui-wgpu = { version = "0.33", features = ["winit"] }
egui-winit = { version = "0.33", default-features = false }
log = "0.4.28"
pollster = "0.3"
web-time = "1.1"

[dependencies]
vibrant = { path = "vibrant" }

wgpu.workspace = true
winit.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui-winit.workspace = true
log.workspace = true
pollster.workspace = true
web-time.workspace = true

env_logger = "0.11"

# [target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_log = "1.0"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
] }

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "main"
harness = false
