[workspace]
members = ["vibrant"]

[package]
name = "vibrant-app"
version = "0.1.0"
edition = "2021"

[lib]
name = "vibrant_app_web"
crate-type = ["cdylib"]

[workspace.dependencies]
wgpu = "30"
winit = "0.30"

egui = { version = "0.36" }
egui-wgpu = { version = "0.36", features = ["winit"] }
egui-winit = { version = "0.36", default-features = false, features=["links"] }
log = "0.4.28"
pollster = "0.3"
web-time = "1.1"

[dependencies]
vibrant = { path = "vibrant" }

wgpu.workspace = true
winit.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui-winit.workspace = true
log.workspace = true
pollster.workspace = true
web-time.workspace = true

env_logger = "0.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_log = "1.0"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
] }

# egui-winit 0.36.1 fails to compile for wasm32: its `NativeFile` only implements
# `DroppedFile::bytes`, but the trait requires `bytes_async` on wasm32.
# https://github.com/emilk/egui/issues/7052 (unfixed upstream as of 2026-08-25).
[patch.crates-io]
egui-winit = { path = "vendor/egui-winit-0.36.1" }
