[workspace]
members = ["vibrant"]

[package]
name = "vibrant-app"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
vibrant = { path = "vibrant" }
winit = "0.30"
web-time = "1.1"
futures = "0.3"
env_logger = "0.11"
log = "0.4"

# [target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_log = "1.0"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
] }

[dev-dependencies]
criterion = "0.3"

[[bench]]
name = "benchmark"
harness = false
