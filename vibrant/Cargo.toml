[package]
name = "vibrant"
version = "0.1.0"
edition = "2021"

[dependencies]
wgpu = "25.0.2"
winit = "0.30"

egui = { git = "https://github.com/emilk/egui.git" }
egui-wgpu = { git = "https://github.com/emilk/egui.git", features = ["winit"] }
rfd = "0.15"
flate2 = "1.0"
bytemuck = { version = "1.18", features = ["derive", "min_const_generics"] }
glam = { version = "0.29", features = ["bytemuck"] }
rayon = "1.10.0"
lindel = "0.1.1"
png = "0.17"
futures = "0.3"
pollster = "0.3"
itertools = "0.13"
integer-sqrt = "0.1"
log = "0.4"
rand = "0.9"

# [target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
