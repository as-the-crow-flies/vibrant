[package]
name = "vibrant"
version = "0.1.0"
edition = "2021"

[dependencies]
wgpu = "22.1"
egui = "0.29"
egui-wgpu = { version = "0.29", features = ["winit"] }
rfd = "0.15"
bytemuck = { version = "1.18", features = ["derive"] }
glam = { version = "0.29", features = ["bytemuck"] }
pollster = "0.3"
itertools = "0.13"
log = "0.4"

# [target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
