[package]
name = "vibrant"
version = "0.1.0"
edition = "2021"

[dependencies]
wgpu.workspace = true
winit.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui-winit.workspace = true
log.workspace = true
pollster.workspace = true
web-time.workspace = true

bytemuck = { version = "1.24", features = ["derive", "min_const_generics"] }
glam = { version = "0.29", features = ["bytemuck"] }
rfd = "0.17"
nifti = { version = "0.17", default-features = false, features = ["nalgebra_affine"] }
flate2 = "1.1"
png = "0.17"
futures-channel = "0.3"
itertools = "0.13"
random_color = "1.1.0"
exr = { version = "1.74", default-features = false }
half = { version = "2.7", features = ["bytemuck"] }
egui_double_slider = "4"
num-traits = "0.2"
strum = { version = "0.27", features = ["derive"] }
egui_dock = "0.21.1"
zip = { version = "2", default-features = false, features = ["deflate-flate2", "flate2"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
exr = { version = "1.74", features = ["rayon"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
wgpu = { workspace = true, features = ["metal"] }

[target.'cfg(windows)'.dependencies]
wgpu = { workspace = true, features = ["dx12"] }

[target.'cfg(all(unix, not(target_vendor = "apple"), not(target_arch = "wasm32")))'.dependencies]
wgpu = { workspace = true, features = ["vulkan"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["webgpu"] }
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2"
getrandom = { version = "0.3.3", features = ["wasm_js"] }
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlAnchorElement",
    "Blob",
    "BlobPropertyBag",
    "Url",
] }

[build-dependencies]
naga = { version = "30", features = ["wgsl-in"] }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["html_reports"] }
wgpu.workspace = true

[[bench]]
name = "cascade"
harness = false

[[bench]]
name = "pipeline"
harness = false
